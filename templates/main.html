<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chess.css') }}">
</head>
<body>
    <div class="board">
        {% for row in board %}
            {% for square in row %}
                <div class="square {{ square.color }}" data-coord="{{ square.coordinate }}">
                    {{ square.coordinate }}
                </div>
            {% endfor %}
        {% endfor %}
    </div>
</body>
</html>
